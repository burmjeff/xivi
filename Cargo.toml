[package]
name = "candle-embeddings"
version = "0.0.1"
edition = "2021"
build = "./lib/build.rs"

[dependencies]
candle-core = "0.7.2"
candle-nn = "0.7.2"
candle-transformers = "0.7.2"
libc = "0.2.159"
hf-hub = { git = "https://github.com/huggingface/hf-hub.git", version = "0.3.2", default-features = false, features = ["rustls-tls", "tokio", "ureq"] }
tokenizers = "0.20.1"
serde_json = "1.0.128"
serde = "1.0.210"
anyhow = "1.0.89"

[dev-dependencies]
clap = "4.5.20"

[lib]
path = "./lib/embedding.rs"
crate-type = ["staticlib"]

[build-dependencies]
anyhow = "1.0.89"
cbindgen = "0.27.0"

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=-crt-static"]

[features]
musl-libc = []