apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
// AGP supplies Kotlin; use its kapt bridge for Room's existing processor.
apply plugin: 'com.android.legacy-kapt'

android {
    namespace = "com.xivi.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.xivi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    androidResources {
        // Keep hidden web-build files out of the packaged Capacitor assets.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
	def releaseStore = System.getenv("XIVI_KEYSTORE_PATH")
	if (releaseStore) {
		signingConfigs {
			xiviRelease {
				storeFile file(releaseStore)
				storePassword System.getenv("XIVI_KEYSTORE_PASSWORD")
				keyAlias System.getenv("XIVI_KEY_ALIAS")
				keyPassword System.getenv("XIVI_KEY_PASSWORD")
			}
		}
		buildTypes.release.signingConfig signingConfigs.xiviRelease
	}
	buildFeatures {
		buildConfig = true
		compose = true
	}
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def buildTypeName = variant.buildType
        variant.outputs.each { output ->
            output.outputFileName.set(output.versionName.map { name ->
                "Xivi-${name}-${buildTypeName}.apk".toString()
            })
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.tv:tv-material:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    kapt 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.coordinatorlayout:coordinatorlayout:${rootProject.ext.androidxCoordinatorLayoutVersion}"
    implementation "androidx.core:core-splashscreen:${rootProject.ext.coreSplashScreenVersion}"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    androidTestImplementation "androidx.test.ext:junit:${rootProject.ext.androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${rootProject.ext.androidxEspressoCoreVersion}"
    implementation project(':capacitor-cordova-android-plugins')
	implementation "org.jetbrains.kotlin:kotlin-stdlib"
	implementation "androidx.media3:media3-exoplayer:${rootProject.ext.media3Version}"
	implementation "androidx.media3:media3-exoplayer-hls:${rootProject.ext.media3Version}"
	implementation "androidx.media3:media3-session:${rootProject.ext.media3Version}"
	implementation "androidx.media3:media3-ui:${rootProject.ext.media3Version}"
	implementation "androidx.media3:media3-datasource-okhttp:${rootProject.ext.media3Version}"
	implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttpVersion}"
	testImplementation "com.squareup.okhttp3:mockwebserver:${rootProject.ext.okhttpVersion}"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
