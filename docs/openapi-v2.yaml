        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudioGroupCreateRequest' }
      responses:
        '201':
          description: Manual lineup group created and attached atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioGroupCreateResult' }
        '202':
          description: Source-linked lineup group created atomically and initial sync queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioGroupCreateResult' }
        default: { $ref: '#/components/responses/Error' }
  /studio/lineups/{lineup_id}/duplicate-tvg-ids:
    get:
      operationId: listDuplicateTVGIDReviews
      parameters:
        - { $ref: '#/components/parameters/LineupId' }
