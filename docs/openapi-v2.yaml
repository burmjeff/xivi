openapi: 3.1.0
info:
  title: Xivi Interface API
  version: 2.0.0
  description: Authenticated API for Xivi Watch and Studio. Cookie mutations require the session-bound X-CSRF-Token. Compatibility players use revocable lineup-scoped media keys, never account passwords.
servers:
  - url: /api/v2
security:
  - cookieAuth: []
paths:
  /tv/auth/device:
    post:
      operationId: beginTVPairing
      security: []
      description: HTTPS only. Begin a ten-minute key-bound pairing request. ES256 DPoP and a server nonce are required. No credentials are included in the approval URL.
      parameters:
        - $ref: '#/components/parameters/DPoPProof'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties:
                device_name: { type: string, minLength: 2, maxLength: 80 }
      responses:
        '200':
          description: Display the code and QR approval URL, then poll no faster than interval.
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    device_code,
                    user_code,
                    verification_uri,
                    verification_uri_complete,
                    expires_in,
                    interval
                  ]
                properties:
                  device_code:
                    {
                      type: string,
                      description: Short-lived secret for the TV polling exchange; never include it in the QR code.
                    }
                  user_code: { type: string }
                  verification_uri: { type: string, format: uri }
                  verification_uri_complete: { type: string, format: uri }
                  expires_in: { type: integer, const: 600 }
                  interval: { type: integer, const: 5 }
        '400':
          description: Invalid proof or use_dpop_nonce. Retry the latter with a fresh proof containing the returned nonce.
          headers:
            DPoP-Nonce: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/APIError' } }
        default: { $ref: '#/components/responses/Error' }
  /tv/auth/decision:
    get:
      operationId: previewTVPairing
      description: Signed-in HTTPS browser only; preview never approves the TV.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string, maxLength: 9 } }
      responses:
        '200':
          description: Display the TV name and code for explicit confirmation.
          content:
            application/json:
              schema:
                type: object
                required: [device_name, user_code, expires_at]
                properties:
                  device_name: { type: string }
                  user_code: { type: string }
                  expires_at: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: decideTVPairing
      security: [{ cookieAuth: [], csrfToken: [] }]
      description: Explicit browser approval or rejection. Existing password/MFA and forced-password-change policy applies. CSRF and origin checks are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code, approve]
              properties:
                user_code: { type: string, maxLength: 9 }
                approve: { type: boolean }
      responses:
        '204': { description: Decision saved. }
        default: { $ref: '#/components/responses/Error' }
  /tv/auth/token:
    post:
      operationId: renewTVSession
      security: []
      description: Exchange an approved device code or renew a durable device-bound credential. Initial delivery is retry-safe until pairing expiry. Renewal does not rotate or expire the durable credential. Access tokens expire after fifteen minutes. Never retry using unbound Bearer authentication.
      parameters:
        - $ref: '#/components/parameters/DPoPProof'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  {
                    type: string,
                    enum: ['urn:ietf:params:oauth:grant-type:device_code', refresh_token]
                  }
                device_code: { type: string, maxLength: 256, writeOnly: true }
                refresh_token: { type: string, maxLength: 256, writeOnly: true }
      responses:
        '200':
          description: Key-bound TV session; refresh credentials have no scheduled or inactivity expiry.
          content:
            application/json: { schema: { $ref: '#/components/schemas/TVSessionEnvelope' } }
        '400':
          description: authorization_pending, slow_down, use_dpop_nonce, invalid_dpop_proof or invalid_grant. Only invalid_grant establishes that pairing is no longer usable. Transport and clock failures must not erase credentials.
          headers:
            DPoP-Nonce: { schema: { type: string } }
            Retry-After: { schema: { type: integer } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/APIError' } }
        default: { $ref: '#/components/responses/Error' }
  /tv/auth/logout:
    post:
      operationId: revokeCurrentTV
      security: [{ tvDPoP: [] }]
      parameters:
        - $ref: '#/components/parameters/DPoPProof'
      responses:
        '204': { description: TV grant revoked and its active viewers disconnected. }
        default: { $ref: '#/components/responses/Error' }
  /watch/preferences:
    get:
      operationId: getViewerPreferences
      security: [{ cookieAuth: [] }, { bearerAuth: [] }, { tvDPoP: [] }]
      responses:
        '200':
          description: Account-synced favorites, hidden channels and ordering, separate from TV-local display controls and history.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ViewerPreferences' } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: saveViewerPreferences
      security: [{ cookieAuth: [], csrfToken: [] }, { bearerAuth: [] }, { tvDPoP: [] }]
      description: Replace the viewer preference document using its last-seen revision. Channel keys are lineup_id:channel_id and must be accessible. At most 20 lists and 10000 distinct channels. Reload on conflict rather than overwriting another device.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ViewerPreferences' } }
      responses:
        '200':
          description: Saved document with incremented revision.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ViewerPreferences' } }
        '409':
          description: Revision conflict; current contains the latest document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, const: preference_conflict }
                  message: { type: string }
                  current: { $ref: '#/components/schemas/ViewerPreferences' }
        default: { $ref: '#/components/responses/Error' }
  /watch/search:
    get:
      operationId: searchWatch
      security: [{ cookieAuth: [] }, { bearerAuth: [] }, { tvDPoP: [] }]
      description: Typed channel and current/upcoming programme search through seven days of supplied EPG. Omitting lineup_id searches all accessible lineups. Existing /search behavior is unchanged.
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 128 }
          }
        - { name: lineup_id, in: query, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/Cursor'
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
          }
      responses:
        '200':
          description: Authorized search page. Expired cursors should restart the query without losing the selected channel.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, next_cursor]
                properties:
                  total: { type: integer }
                  next_cursor: { type: [string, 'null'] }
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, lineup_id, channel_id, programme_id, title]
                      properties:
                        kind: { type: string, enum: [channel, programme] }
                        lineup_id: { type: integer, format: int64 }
                        channel_id: { type: integer, format: int64 }
                        programme_id: { type: integer, format: int64 }
                        title: { type: string }
                        start: { type: [string, 'null'], format: date-time }
                        end: { type: [string, 'null'], format: date-time }
        default: { $ref: '#/components/responses/Error' }
  /auth/bootstrap-status:
    get:
      operationId: getBootstrapStatus
      security: []
      responses:
        '200':
          {
            description: First-run administrator and password-change state. Detailed state is returned only to direct trusted-LAN clients; public callers receive a neutral response.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required:
                          [
                            bootstrap_required,
                            initial_password_change_required,
                            initial_login_allowed
                          ],
                        properties:
                          {
                            bootstrap_required: { type: boolean },
                            initial_password_change_required: { type: boolean },
                            initial_login_allowed:
                              {
                                type: boolean,
                                description: True only for direct trusted-LAN requests when the automatic temporary administrator is active and the transport is permitted.
                              }
                          }
                      }
                  }
              }
          }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                bot_challenge_token:
                  type: string
                  description: Opaque adaptive browser-challenge token returned by a prior throttled response.
                bot_challenge_nonce:
                  type: string
                  description: Proof-of-work nonce for the adaptive browser challenge.
      responses:
        '200':
          {
            description: Authenticated session.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SessionPrincipal' } } }
          }
        '202':
          {
            description: Password accepted; MFA verification is required before a session is created.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/LoginChallenge' } } }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/login/mfa:
    post:
      operationId: completeMFALogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_token, code, trust_browser]
              properties:
                challenge_token: { type: string }
                code: { type: string }
                trust_browser:
                  type: boolean
                  description: Store a separate revocable browser approval for 30 days. A password is still required at future sign-ins.
                bot_challenge_token: { type: string }
                bot_challenge_nonce: { type: string }
      responses:
        '200':
          description: MFA verified and authenticated session created.
          content:
            application/json: { schema: { $ref: '#/components/schemas/SessionPrincipal' } }
        default: { $ref: '#/components/responses/Error' }
  /mobile/auth/login:
    post:
      operationId: mobileLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, device_name]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                device_name: { type: string, minLength: 2, maxLength: 80 }
                bot_challenge_token: { type: string }
                bot_challenge_nonce: { type: string }
      responses:
        '200':
          {
            description: Mobile session created.,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/MobileSessionEnvelope' } }
              }
          }
        '202':
          {
            description: MFA required.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/LoginChallenge' } } }
          }
        default: { $ref: '#/components/responses/Error' }
  /mobile/auth/login/mfa:
    post:
      operationId: completeMobileMFALogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_token, code, device_name]
              properties:
                challenge_token: { type: string }
                code: { type: string }
                device_name: { type: string, minLength: 2, maxLength: 80 }
                bot_challenge_token: { type: string }
                bot_challenge_nonce: { type: string }
      responses:
        '200':
          {
            description: Mobile MFA verified.,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/MobileSessionEnvelope' } }
              }
          }
        default: { $ref: '#/components/responses/Error' }
  /mobile/auth/refresh:
    post:
      operationId: refreshMobileSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties: { refresh_token: { type: string } }
      responses:
        '200':
          {
            description: Both opaque tokens rotated.,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/MobileSessionEnvelope' } }
              }
          }
        default: { $ref: '#/components/responses/Error' }
  /mobile/auth/logout:
    post:
      operationId: mobileLogout
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Mobile session revoked. }
        default: { $ref: '#/components/responses/Error' }
  /mobile/auth/password:
    post:
      operationId: changeMobilePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8, maxLength: 128 }
                mfa_code: { type: string }
      responses:
        '200':
          {
            description: Password changed and replacement mobile session created.,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/MobileSessionEnvelope' } }
              }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/session:
    get:
      operationId: getSession
      responses:
        '200':
          {
            description: Current principal and CSRF token.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SessionPrincipal' } } }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        {
          '204': { description: Session revoked. },
          default: { $ref: '#/components/responses/Error' }
        }
  /auth/reauth:
    post:
      operationId: reauthenticate
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: '#/components/schemas/ReauthenticationRequest' } }
            }
        }
      responses:
        {
          '204': { description: Recent identity confirmation recorded. },
          default: { $ref: '#/components/responses/Error' }
        }
  /auth/password:
    post:
      operationId: changePassword
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8, maxLength: 128 }
                mfa_code: { type: string }
      responses:
        '200':
          {
            description: Password changed and replacement session created.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SessionPrincipal' } } }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/enroll:
    post:
      operationId: enrollMFA
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        '200':
          {
            description: Pending TOTP secret shown only for confirmation.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { secret: { type: string }, otpauth_uri: { type: string } }
                      }
                  }
              }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/confirm:
    post:
      operationId: confirmMFA
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [secret, code],
                      properties: { secret: { type: string }, code: { type: string } }
                    }
                }
            }
        }
      responses:
        '200':
          {
            description: MFA enabled; recovery codes returned once.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { recovery_codes: { type: array, items: { type: string } } }
                      }
                  }
              }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa:
    delete:
      operationId: disableMFA
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        {
          '204': { description: MFA disabled and sessions revoked. },
          default: { $ref: '#/components/responses/Error' }
        }
  /auth/mfa/recovery-codes:
    post:
      operationId: regenerateMFARecoveryCodes
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        '200':
          description: Replacement one-time recovery codes; previous codes are invalidated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Error' }
  /auth/sessions:
    get:
      operationId: listAccountSessions
      responses:
        '200':
          {
            description: Account sessions.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            items:
                              {
                                type: array,
                                items: { $ref: '#/components/schemas/AuthSessionMetadata' }
                              }
                          }
                      }
                  }
              }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/sessions/{session_id}:
    delete:
      operationId: revokeAccountSession
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Session revoked. }
        default: { $ref: '#/components/responses/Error' }
  /auth/sessions/{session_type}/{session_id}:
    delete:
      operationId: revokeTypedAccountSession
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - {
            name: session_type,
            in: path,
            required: true,
            schema: { type: string, enum: [browser, mobile, tv] }
          }
        - { name: session_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Session revoked. }
        default: { $ref: '#/components/responses/Error' }
  /auth/trusted-browsers:
    get:
      operationId: listTrustedBrowsers
      responses:
        '200':
          description: Bounded trusted-browser history with active approvals first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TrustedBrowser' } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: revokeAllTrustedBrowsers
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        '204':
          { description: Every trusted-browser approval revoked; current sessions remain active. }
        default: { $ref: '#/components/responses/Error' }
  /auth/trusted-browsers/{browser_id}:
    delete:
      operationId: revokeTrustedBrowser
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: browser_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204':
          { description: Trusted-browser approval revoked; its current session remains active. }
        default: { $ref: '#/components/responses/Error' }
  /account/profile:
    patch:
      operationId: updateAccountProfile
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityWriteRequest' }
      responses:
        '200':
          description: Identity updated. Username changes revoke other browser sessions and rotate the current session; media keys remain active.
          content:
            application/json: { schema: { $ref: '#/components/schemas/SessionPrincipal' } }
        default: { $ref: '#/components/responses/Error' }
  /account/media-keys:
    get:
      operationId: listMediaKeys
      responses:
        '200':
          {
            description: Key metadata; plaintext is never recoverable.,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/MediaKeyListResponse' } }
              }
          }
    post:
      operationId: createMediaKey
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/MediaKeyCreateRequest' } } }
        }
      responses:
        '201':
          {
            description: Named device access with reusable secured output links. The standalone credential is never returned.,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/MediaKeyCreateResponse' } }
              }
          }
        default: { $ref: '#/components/responses/Error' }
  /account/media-keys/{key_id}:
    delete:
      operationId: revokeMediaKey
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        [{ name: key_id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        {
          '204': { description: Key revoked and active clients disconnected. },
          default: { $ref: '#/components/responses/Error' }
        }
  /studio/users:
    get:
      operationId: listUsers
      responses:
        '200':
          {
            description: Users and grantable lineups.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            items:
                              { type: array, items: { $ref: '#/components/schemas/UserSummary' } },
                            lineups:
                              { type: array, items: { $ref: '#/components/schemas/LineupGrant' } }
                          }
                      }
                  }
              }
          }
    post:
      operationId: createUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/UserWriteRequest' } } }
        }
      responses:
        {
          '201':
            {
              description: User created.,
              content:
                { application/json: { schema: { $ref: '#/components/schemas/UserSummary' } } }
            },
          default: { $ref: '#/components/responses/Error' }
        }
  /studio/users/{user_id}:
    patch:
      operationId: updateUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/UserUpdateRequest' } } }
        }
      responses:
        {
          '200':
            {
              description: User updated and credentials revoked.,
              content:
                { application/json: { schema: { $ref: '#/components/schemas/UserSummary' } } }
            },
          default: { $ref: '#/components/responses/Error' }
        }
    delete:
      operationId: deleteUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        { '204': { description: User deleted. }, default: { $ref: '#/components/responses/Error' } }
  /studio/users/{user_id}/profile:
    patch:
      operationId: updateUserProfile
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityWriteRequest' }
      responses:
        '200':
          description: User identity updated. Username changes revoke browser sessions but retain media keys.
          content:
            application/json: { schema: { $ref: '#/components/schemas/UserSummary' } }
        default: { $ref: '#/components/responses/Error' }
  /studio/users/{user_id}/password-reset:
    post:
      operationId: resetUserPassword
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Temporary password set and credentials revoked. }
        default: { $ref: '#/components/responses/Error' }
  /studio/users/{user_id}/mfa:
    delete:
      operationId: resetUserMFA
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: MFA reset and sessions revoked. }
        default: { $ref: '#/components/responses/Error' }
  /studio/users/{user_id}/sessions:
    get:
      operationId: listUserSessions
      description: Administrator-only listing of browser, phone and paired TV sessions; no credentials are returned.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: Session metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    { type: array, items: { $ref: '#/components/schemas/AuthSessionMetadata' } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: revokeUserSessions
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: All browser, mobile and TV sessions revoked. }
        default: { $ref: '#/components/responses/Error' }
  /studio/users/{user_id}/sessions/{session_type}/{session_id}:
    delete:
      operationId: revokeUserSession
      description: Revoke one session owned by this user. Requires administrator browser authentication and reauthentication within five minutes.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - {
            name: session_type,
            in: path,
            required: true,
            schema: { type: string, enum: [browser, mobile, tv] }
          }
        - { name: session_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Session revoked and its viewers disconnected. }
        default: { $ref: '#/components/responses/Error' }
  /studio/users/{user_id}/media-keys:
    get:
      operationId: listUserMediaKeys
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: Inspectable key metadata without recoverable plaintext credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MediaAccessKeyMetadata' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: revokeUserMediaKeys
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: All media keys revoked and affected viewers disconnected. }
        default: { $ref: '#/components/responses/Error' }
  /studio/users/{user_id}/media-keys/{key_id}:
    delete:
      operationId: revokeUserMediaKey
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: key_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Selected media key revoked and affected viewers disconnected. }
        default: { $ref: '#/components/responses/Error' }
  /studio/security/audit:
    get:
      operationId: listSecurityAudit
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          {
            description: Bounded security event page.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SecurityAuditPage' } } }
          }
        default: { $ref: '#/components/responses/Error' }
  /studio/security/auth-protection:
    get:
      operationId: getAuthenticationProtection
      responses:
        '200':
          description: Aggregated recent authentication failures and active adaptive throttles.
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuthProtectionResponse' } }
        default: { $ref: '#/components/responses/Error' }
  /studio/security/auth-protection/{bucket_id}:
    delete:
      operationId: clearAuthenticationThrottle
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - name: bucket_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Selected adaptive throttle cleared. }
        default: { $ref: '#/components/responses/Error' }
  /media/v1/lineups/{lineup_id}/playlist.m3u:
    get:
      operationId: getSecuredM3U
      servers: [{ url: / }]
      security: [{ mediaKey: [] }]
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      responses:
        {
          '200':
            {
              description: Dynamic secured playlist.,
              content: { audio/x-mpegurl: { schema: { type: string } } }
            },
          default: { $ref: '#/components/responses/Error' }
        }
  /media/v1/lineups/{lineup_id}/guide.xml:
    get:
      operationId: getSecuredXMLTV
      servers: [{ url: / }]
      security: [{ mediaKey: [] }]
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      responses:
        {
          '200':
            {
              description: Authorized dynamic XMLTV.,
              content: { application/xml: { schema: { type: string } } }
            },
          default: { $ref: '#/components/responses/Error' }
        }
  /m/{code}:
    get:
      operationId: getShortSecuredM3U
      servers: [{ url: / }]
      security: []
      description: Resolves a revocable, lineup-scoped short output alias. The alias is the bearer credential for this request; generated stream URLs retain the full internal media credential.
      parameters:
        - name: code
          in: path
          required: true
          description: Case-insensitive 16-symbol Crockford Base32 code; display hyphens are optional.
          schema: { type: string, minLength: 16, maxLength: 19 }
      responses:
        '200':
          description: Dynamic secured playlist with its XMLTV address embedded.
          content: { audio/x-mpegurl: { schema: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /x/{code}:
    get:
      operationId: getShortSecuredXMLTV
      servers: [{ url: / }]
      security: []
      description: Resolves the XMLTV output for a revocable, lineup-scoped short output alias.
      parameters:
        - name: code
          in: path
          required: true
          description: Case-insensitive 16-symbol Crockford Base32 code; display hyphens are optional.
          schema: { type: string, minLength: 16, maxLength: 19 }
      responses:
        '200':
          description: Authorized dynamic XMLTV.
          content: { application/xml: { schema: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /watch/lineups:
    get:
      operationId: listWatchLineups
      responses:
        '200': { $ref: '#/components/responses/LineupPage' }
  /watch/lineups/{lineup_id}/channels:
    get:
      operationId: listWatchChannels
      parameters:
        - {
            name: metadata_only,
            in: query,
            schema: { type: boolean, default: false },
            description: 'Skip programme loading while retaining identities, scoped stream URLs and logos.'
          }
        - {
            name: on_now_category,
            in: query,
            schema: { type: string, maxLength: 80 },
            description: Filter channels by an exact case-insensitive category of a programme currently on air.
          }
        - $ref: '#/components/parameters/VisibleChannelIDs'
        - $ref: '#/components/parameters/LineupId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/GuideChannelPage' }
        default: { $ref: '#/components/responses/Error' }
  /watch/lineups/{lineup_id}/groups:
    get:
      operationId: listWatchLineupGroups
      description: Authorized lineup groups plus on_now_categories metadata across the lineup, independent of the visible guide window.
      parameters:
        - $ref: '#/components/parameters/LineupId'
      responses:
        '200': { $ref: '#/components/responses/WatchGroupPage' }
        default: { $ref: '#/components/responses/Error' }
  /watch/lineups/{lineup_id}/channels/{channel_id}/neighbors:
    get:
      operationId: getWatchChannelNeighbors
      parameters:
        - $ref: '#/components/parameters/LineupId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Adjacent playable channels in saved lineup order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchChannelNeighbors' }
        default: { $ref: '#/components/responses/Error' }
  /watch/lineups/{lineup_id}/guide:
    get:
      operationId: getWatchGuide
      description: Bounded schedule query. The response includes coverage with requested_from/to, available_from/to, generated_at, and nullable source_updated_at (unknown when not available). Windows are at most 72 hours; query individual windows to browse up to seven days ahead.
      parameters:
        - $ref: '#/components/parameters/VisibleChannelIDs'
        - $ref: '#/components/parameters/LineupId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Search'
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/GuideChannelPage' }
        default: { $ref: '#/components/responses/Error' }
  /watch/channels/{channel_id}:
    get:
      operationId: getWatchChannel
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - { name: lineup_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Channel with the current guide window.
          content: { application/json: { schema: { $ref: '#/components/schemas/GuideChannel' } } }
        default: { $ref: '#/components/responses/Error' }
  /search:
    get:
      operationId: searchXivi
      parameters:
        - $ref: '#/components/parameters/Search'
        - { name: scope, in: query, schema: { type: string, enum: [all, channels, resources] } }
        - { name: lineup_id, in: query, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/GuideChannelPage' }
        default: { $ref: '#/components/responses/Error' }
  /studio/overview:
    get:
      operationId: getStudioOverview
      responses:
        '200':
          description: Studio setup health and recent jobs.
          content:
            application/json:
              schema:
                type: object
                required: [summary, jobs]
                properties:
                  summary: { $ref: '#/components/schemas/StudioOverview' }
                  jobs: { type: array, items: { $ref: '#/components/schemas/OperationJob' } }
        default: { $ref: '#/components/responses/Error' }
  /studio/streaming/status:
    get:
      operationId: getStreamingStatus
      responses:
        '200':
          description: Active shared producers, viewers, failovers and backpressure metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamingStatus' }
  /studio/streams:
    get:
      operationId: getStudioStreams
      responses:
        '200':
          description: Active stream telemetry plus retained session and event history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioStreamsResponse' }
        default: { $ref: '#/components/responses/Error' }
  /studio/streams/history/{incident_id}:
    get:
      operationId: getStudioStreamHistory
      parameters:
        - { name: incident_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Durable viewer and event audit for one session instance.
          content:
            application/json:
              schema:
                type: object
                required: [connections, events]
                properties:
                  connections:
                    { type: array, items: { $ref: '#/components/schemas/StreamConnection' } }
                  events: { type: array, items: { $ref: '#/components/schemas/StreamEvent' } }
        default: { $ref: '#/components/responses/Error' }
  /studio/streams/{stream_id}:
    delete:
      operationId: stopStudioStream
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Producer and viewers stopped. }
        default: { $ref: '#/components/responses/Error' }
  /studio/streams/{stream_id}/restart:
    post:
      operationId: restartStudioStreamSource
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Source restart requested. }
        default: { $ref: '#/components/responses/Error' }
  /studio/streams/{stream_id}/failover:
    post:
      operationId: failoverStudioStreamSource
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Ordered-source failover requested. }
        default: { $ref: '#/components/responses/Error' }
  /studio/streams/{stream_id}/connections/{connection_id}:
    delete:
      operationId: disconnectStudioStreamViewer
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string } }
        - { name: connection_id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Viewer disconnected. }
        default: { $ref: '#/components/responses/Error' }
  /stream/telemetry:
    post:
      operationId: recordPlayerTelemetry
      description: TV timing event codes are tv_tune_request (manifest ready), tv_first_frame, tv_rebuffer, tv_tune_cancelled and tv_recovery. Details include tune_id, tune_requested_at, duration_ms, manifest_ready_ms, buffer_preset and optional post_manifest_first_frame_ms. Durations are monotonic client measurements, not provider guarantees.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream_id, viewer_id, severity, code, message]
              properties:
                stream_id: { type: string }
                viewer_id: { type: string }
                severity: { type: string, enum: [info, warning, error] }
                code: { type: string }
                message: { type: string }
                details: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Telemetry linked to an active diagnostic incident.
          content:
            application/json:
              schema:
                type: object
                required: [incident_id, code]
                properties:
                  incident_id: { type: string }
                  code: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /stream/prewarm/{stream_id}:
    post:
      operationId: prewarmStream
      description: Opportunistically starts a channel without a viewer. Per-source connection budgets always take precedence.
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Prewarm requested. }
        '204': { description: Prewarming is disabled. }
        default: { $ref: '#/components/responses/Error' }
  /watch/playback/release:
    post:
      operationId: releaseWatchPlayback
      description: Immediately releases a controlled Watch playback lease. The operation is idempotent and safe to send during page unload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playback_id, stream_id]
              properties:
                playback_id: { type: string, minLength: 1, maxLength: 512 }
                stream_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '204': { description: Playback lease released or already absent. }
        default: { $ref: '#/components/responses/Error' }
  /studio/device-outputs:
    get:
      operationId: getDeviceOutputs
      responses:
        '200':
          description: Virtual tuner state and the device generated for every lineup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceOutputs' }
        default: { $ref: '#/components/responses/Error' }
  /studio/device-outputs/virtual-tuner/{lineup_id}:
    patch:
      operationId: setLineupVirtualTunerEnabled
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated virtual tuner state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceOutputs' }
        default: { $ref: '#/components/responses/Error' }
  /studio/device-outputs/virtual-tuner/{lineup_id}/credential/rotate:
    post:
      operationId: rotateLineupVirtualTunerCredential
      description: Rotates the lineup-scoped LAN credential and immediately disconnects clients using the previous credential.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      responses:
        '200':
          description: Updated virtual tuner state and replacement URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceOutputs' }
        default: { $ref: '#/components/responses/Error' }
  /studio/device-outputs/fill-missing-guide-slots/{lineup_id}:
    patch:
      operationId: setLineupFillMissingGuideSlots
      description: Controls export-only placeholder programmes for uncovered XMLTV intervals and queues an XMLTV rebuild when changed.
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '202':
          description: Updated setting and queued XMLTV rebuild.
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status]
                properties:
                  job_id: { type: integer, format: int64 }
                  status: { type: string, enum: [queued] }
        '200':
          description: The setting was already in the requested state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceOutputs' }
        default: { $ref: '#/components/responses/Error' }
  /studio/guide-data/coverage:
    get:
      operationId: getGuideCoverage
      responses:
        '200':
          description: Guide mapping coverage.
          content:
            { application/json: { schema: { $ref: '#/components/schemas/CoverageSummary' } } }
        default: { $ref: '#/components/responses/Error' }
  /studio/lineups:
    get:
      operationId: listStudioLineups
      responses:
        '200': { $ref: '#/components/responses/LineupPage' }
  /studio/lineups/{lineup_id}/groups:
    get:
      operationId: listStudioLineupGroups
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      responses:
        '200':
          description: Ordered lineup groups.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioGroupPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createStudioGroup
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
