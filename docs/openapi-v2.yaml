openapi: 3.1.0
info:
  title: Xivi Interface API
  version: 2.0.0
  description: Authenticated API for Xivi Watch and Studio. Cookie mutations require the session-bound X-CSRF-Token. Compatibility players use revocable lineup-scoped media keys, never account passwords.
servers:
  - url: /api/v2
security:
  - cookieAuth: []
paths:
  /auth/bootstrap-status:
    get:
      operationId: getBootstrapStatus
      security: []
      responses:
        '200':
          {
            description: First-run administrator and password-change state. Detailed state is returned only to direct trusted-LAN clients; public callers receive a neutral response.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required:
                          [
                            bootstrap_required,
                            initial_password_change_required,
                            initial_login_allowed
                          ],
                        properties:
                          {
                            bootstrap_required: { type: boolean },
                            initial_password_change_required: { type: boolean },
                            initial_login_allowed:
                              {
                                type: boolean,
                                description: True only for direct trusted-LAN requests when the automatic temporary administrator is active and the transport is permitted.
                              }
                          }
                      }
                  }
              }
          }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                mfa_code: { type: string }
      responses:
        '200':
          {
            description: Authenticated session.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SessionPrincipal' } } }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/session:
    get:
      operationId: getSession
      responses:
        '200':
          {
            description: Current principal and CSRF token.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SessionPrincipal' } } }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        {
          '204': { description: Session revoked. },
          default: { $ref: '#/components/responses/Error' }
        }
  /auth/reauth:
    post:
      operationId: reauthenticate
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: '#/components/schemas/ReauthenticationRequest' } }
            }
        }
      responses:
        {
          '204': { description: Recent identity confirmation recorded. },
          default: { $ref: '#/components/responses/Error' }
        }
  /auth/password:
    post:
      operationId: changePassword
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8, maxLength: 128 }
                mfa_code: { type: string }
      responses:
        '200':
          {
            description: Password changed and replacement session created.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SessionPrincipal' } } }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/enroll:
    post:
      operationId: enrollMFA
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        '200':
          {
            description: Pending TOTP secret shown only for confirmation.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { secret: { type: string }, otpauth_uri: { type: string } }
                      }
                  }
              }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/confirm:
    post:
      operationId: confirmMFA
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [secret, code],
                      properties: { secret: { type: string }, code: { type: string } }
                    }
                }
            }
        }
      responses:
        '200':
          {
            description: MFA enabled; recovery codes returned once.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { recovery_codes: { type: array, items: { type: string } } }
                      }
                  }
              }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa:
    delete:
      operationId: disableMFA
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        {
          '204': { description: MFA disabled and sessions revoked. },
          default: { $ref: '#/components/responses/Error' }
        }
  /auth/mfa/recovery-codes:
    post:
      operationId: regenerateMFARecoveryCodes
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        '200':
          description: Replacement one-time recovery codes; previous codes are invalidated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Error' }
  /auth/sessions:
    get:
      operationId: listAccountSessions
      responses:
        '200':
          {
            description: Account sessions.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            items:
                              {
                                type: array,
                                items: { $ref: '#/components/schemas/AuthSessionMetadata' }
                              }
                          }
                      }
                  }
              }
          }
        default: { $ref: '#/components/responses/Error' }
  /auth/sessions/{session_id}:
    delete:
      operationId: revokeAccountSession
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Session revoked. }
        default: { $ref: '#/components/responses/Error' }
  /account/media-keys:
    get:
      operationId: listMediaKeys
      responses:
        '200':
          {
            description: Key metadata; plaintext is never recoverable.,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/MediaKeyListResponse' } }
              }
          }
    post:
      operationId: createMediaKey
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/MediaKeyCreateRequest' } } }
        }
      responses:
        '201':
          {
            description: Named device access with reusable secured output links. The standalone credential is never returned.,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/MediaKeyCreateResponse' } }
              }
          }
        default: { $ref: '#/components/responses/Error' }
  /account/media-keys/{key_id}:
    delete:
      operationId: revokeMediaKey
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        [{ name: key_id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        {
          '204': { description: Key revoked and active clients disconnected. },
          default: { $ref: '#/components/responses/Error' }
        }
  /studio/users:
    get:
      operationId: listUsers
      responses:
        '200':
          {
            description: Users and grantable lineups.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            items:
                              { type: array, items: { $ref: '#/components/schemas/UserSummary' } },
                            lineups:
                              { type: array, items: { $ref: '#/components/schemas/LineupGrant' } }
                          }
                      }
                  }
              }
          }
    post:
      operationId: createUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/UserWriteRequest' } } }
        }
      responses:
        {
          '201':
            {
              description: User created.,
              content:
                { application/json: { schema: { $ref: '#/components/schemas/UserSummary' } } }
            },
          default: { $ref: '#/components/responses/Error' }
        }
  /studio/users/{user_id}:
    patch:
      operationId: updateUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/UserUpdateRequest' } } }
        }
      responses:
        {
          '200':
            {
              description: User updated and credentials revoked.,
              content:
                { application/json: { schema: { $ref: '#/components/schemas/UserSummary' } } }
            },
          default: { $ref: '#/components/responses/Error' }
        }
    delete:
      operationId: deleteUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        { '204': { description: User deleted. }, default: { $ref: '#/components/responses/Error' } }
  /studio/users/{user_id}/password-reset:
    post:
      operationId: resetUserPassword
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Temporary password set and credentials revoked. }
        default: { $ref: '#/components/responses/Error' }
  /studio/users/{user_id}/mfa:
    delete:
      operationId: resetUserMFA
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: MFA reset and sessions revoked. }
        default: { $ref: '#/components/responses/Error' }
  /studio/users/{user_id}/sessions:
    delete:
      operationId: revokeUserSessions
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: All browser sessions revoked. }
        default: { $ref: '#/components/responses/Error' }
  /studio/users/{user_id}/media-keys:
    get:
      operationId: listUserMediaKeys
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: Inspectable key metadata without recoverable plaintext credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MediaAccessKeyMetadata' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: revokeUserMediaKeys
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: All media keys revoked and affected viewers disconnected. }
        default: { $ref: '#/components/responses/Error' }
  /studio/users/{user_id}/media-keys/{key_id}:
    delete:
      operationId: revokeUserMediaKey
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: key_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Selected media key revoked and affected viewers disconnected. }
        default: { $ref: '#/components/responses/Error' }
  /studio/security/audit:
    get:
      operationId: listSecurityAudit
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          {
            description: Bounded security event page.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SecurityAuditPage' } } }
          }
        default: { $ref: '#/components/responses/Error' }
  /media/v1/lineups/{lineup_id}/playlist.m3u:
    get:
      operationId: getSecuredM3U
      servers: [{ url: / }]
      security: [{ mediaKey: [] }]
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      responses:
        {
          '200':
            {
              description: Dynamic secured playlist.,
              content: { audio/x-mpegurl: { schema: { type: string } } }
            },
          default: { $ref: '#/components/responses/Error' }
        }
  /media/v1/lineups/{lineup_id}/guide.xml:
    get:
      operationId: getSecuredXMLTV
      servers: [{ url: / }]
      security: [{ mediaKey: [] }]
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      responses:
        {
          '200':
            {
              description: Authorized dynamic XMLTV.,
              content: { application/xml: { schema: { type: string } } }
            },
          default: { $ref: '#/components/responses/Error' }
        }
  /watch/lineups:
    get:
      operationId: listWatchLineups
      responses:
        '200': { $ref: '#/components/responses/LineupPage' }
  /watch/lineups/{lineup_id}/channels:
    get:
      operationId: listWatchChannels
      parameters:
        - $ref: '#/components/parameters/LineupId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/GuideChannelPage' }
        default: { $ref: '#/components/responses/Error' }
  /watch/lineups/{lineup_id}/groups:
    get:
      operationId: listWatchLineupGroups
      parameters:
        - $ref: '#/components/parameters/LineupId'
      responses:
        '200': { $ref: '#/components/responses/WatchGroupPage' }
        default: { $ref: '#/components/responses/Error' }
  /watch/lineups/{lineup_id}/channels/{channel_id}/neighbors:
    get:
      operationId: getWatchChannelNeighbors
      parameters:
        - $ref: '#/components/parameters/LineupId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Adjacent playable channels in saved lineup order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchChannelNeighbors' }
        default: { $ref: '#/components/responses/Error' }
  /watch/lineups/{lineup_id}/guide:
    get:
      operationId: getWatchGuide
      parameters:
        - $ref: '#/components/parameters/LineupId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Search'
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/GuideChannelPage' }
        default: { $ref: '#/components/responses/Error' }
  /watch/channels/{channel_id}:
    get:
      operationId: getWatchChannel
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - { name: lineup_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Channel with the current guide window.
          content: { application/json: { schema: { $ref: '#/components/schemas/GuideChannel' } } }
        default: { $ref: '#/components/responses/Error' }
  /search:
    get:
      operationId: searchXivi
      parameters:
        - $ref: '#/components/parameters/Search'
        - { name: scope, in: query, schema: { type: string, enum: [all, channels, resources] } }
        - { name: lineup_id, in: query, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/GuideChannelPage' }
        default: { $ref: '#/components/responses/Error' }
  /studio/overview:
    get:
      operationId: getStudioOverview
      responses:
        '200':
          description: Studio setup health and recent jobs.
          content:
            application/json:
              schema:
                type: object
                required: [summary, jobs]
                properties:
                  summary: { $ref: '#/components/schemas/StudioOverview' }
                  jobs: { type: array, items: { $ref: '#/components/schemas/OperationJob' } }
        default: { $ref: '#/components/responses/Error' }
  /studio/streaming/status:
    get:
      operationId: getStreamingStatus
      responses:
        '200':
          description: Active shared producers, viewers, failovers and backpressure metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamingStatus' }
  /studio/streams:
    get:
      operationId: getStudioStreams
      responses:
        '200':
          description: Active stream telemetry plus retained session and event history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioStreamsResponse' }
        default: { $ref: '#/components/responses/Error' }
  /studio/streams/history/{incident_id}:
    get:
      operationId: getStudioStreamHistory
      parameters:
        - { name: incident_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Durable viewer and event audit for one session instance.
          content:
            application/json:
              schema:
                type: object
                required: [connections, events]
                properties:
                  connections:
                    { type: array, items: { $ref: '#/components/schemas/StreamConnection' } }
                  events: { type: array, items: { $ref: '#/components/schemas/StreamEvent' } }
        default: { $ref: '#/components/responses/Error' }
  /studio/streams/{stream_id}:
    delete:
      operationId: stopStudioStream
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Producer and viewers stopped. }
        default: { $ref: '#/components/responses/Error' }
  /studio/streams/{stream_id}/restart:
    post:
      operationId: restartStudioStreamSource
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Source restart requested. }
        default: { $ref: '#/components/responses/Error' }
  /studio/streams/{stream_id}/failover:
    post:
      operationId: failoverStudioStreamSource
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Ordered-source failover requested. }
        default: { $ref: '#/components/responses/Error' }
  /studio/streams/{stream_id}/connections/{connection_id}:
    delete:
      operationId: disconnectStudioStreamViewer
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string } }
        - { name: connection_id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Viewer disconnected. }
        default: { $ref: '#/components/responses/Error' }
  /stream/telemetry:
    post:
      operationId: recordPlayerTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream_id, viewer_id, severity, code, message]
              properties:
                stream_id: { type: string }
                viewer_id: { type: string }
                severity: { type: string, enum: [info, warning, error] }
                code: { type: string }
                message: { type: string }
                details: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Telemetry linked to an active diagnostic incident.
          content:
            application/json:
              schema:
                type: object
                required: [incident_id, code]
                properties:
                  incident_id: { type: string }
                  code: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /stream/prewarm/{stream_id}:
    post:
      operationId: prewarmStream
      description: Opportunistically starts a channel without a viewer. Per-source connection budgets always take precedence.
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Prewarm requested. }
        '204': { description: Prewarming is disabled. }
        default: { $ref: '#/components/responses/Error' }
  /watch/playback/release:
    post:
      operationId: releaseWatchPlayback
      description: Immediately releases a controlled Watch playback lease. The operation is idempotent and safe to send during page unload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playback_id, stream_id]
              properties:
                playback_id: { type: string, minLength: 1, maxLength: 512 }
                stream_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '204': { description: Playback lease released or already absent. }
        default: { $ref: '#/components/responses/Error' }
  /studio/device-outputs:
    get:
      operationId: getDeviceOutputs
      responses:
        '200':
          description: Virtual tuner state and the device generated for every lineup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceOutputs' }
        default: { $ref: '#/components/responses/Error' }
  /studio/device-outputs/virtual-tuner/{lineup_id}:
    patch:
      operationId: setLineupVirtualTunerEnabled
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated virtual tuner state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceOutputs' }
        default: { $ref: '#/components/responses/Error' }
  /studio/device-outputs/virtual-tuner/{lineup_id}/credential/rotate:
    post:
      operationId: rotateLineupVirtualTunerCredential
      description: Rotates the lineup-scoped LAN credential and immediately disconnects clients using the previous credential.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      responses:
        '200':
          description: Updated virtual tuner state and replacement URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceOutputs' }
        default: { $ref: '#/components/responses/Error' }
  /studio/device-outputs/fill-missing-guide-slots/{lineup_id}:
    patch:
      operationId: setLineupFillMissingGuideSlots
      description: Controls export-only placeholder programmes for uncovered XMLTV intervals and queues an XMLTV rebuild when changed.
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '202':
          description: Updated setting and queued XMLTV rebuild.
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status]
                properties:
                  job_id: { type: integer, format: int64 }
                  status: { type: string, enum: [queued] }
        '200':
          description: The setting was already in the requested state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceOutputs' }
        default: { $ref: '#/components/responses/Error' }
  /studio/guide-data/coverage:
    get:
      operationId: getGuideCoverage
      responses:
        '200':
          description: Guide mapping coverage.
          content:
            { application/json: { schema: { $ref: '#/components/schemas/CoverageSummary' } } }
        default: { $ref: '#/components/responses/Error' }
  /studio/lineups:
    get:
      operationId: listStudioLineups
      responses:
        '200': { $ref: '#/components/responses/LineupPage' }
  /studio/lineups/{lineup_id}/groups:
    get:
      operationId: listStudioLineupGroups
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      responses:
        '200':
          description: Ordered lineup groups.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioGroupPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createStudioGroup
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudioGroupCreateRequest' }
      responses:
        '201':
          description: Manual lineup group created and attached atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioGroupCreateResult' }
        '202':
          description: Source-linked lineup group created atomically and initial sync queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioGroupCreateResult' }
        default: { $ref: '#/components/responses/Error' }
  /studio/lineups/{lineup_id}/duplicate-tvg-ids:
    get:
      operationId: listDuplicateTVGIDReviews
      parameters:
        - { $ref: '#/components/parameters/LineupId' }
        - name: include_acknowledged
          in: query
          description: Include intentionally shared guide identities that have been reviewed.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Separate lineup channels grouped by their duplicate normalized TVG ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateTVGIDReviewPage' }
        default: { $ref: '#/components/responses/Error' }
  /studio/lineups/{lineup_id}/duplicate-tvg-ids/review:
    put:
      operationId: setDuplicateTVGIDReview
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateTVGIDReviewRequest' }
      responses:
        '204': { description: Review acknowledgement updated for the current channel set. }
        default: { $ref: '#/components/responses/Error' }
  /studio/lineups/{lineup_id}/duplicate-tvg-ids/merge:
    post:
      operationId: mergeDuplicateTVGIDChannels
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateTVGIDMergeRequest' }
      responses:
        '200':
          description: Duplicate canonical channels merged into one ordered source stack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateTVGIDMergeResult' }
        default: { $ref: '#/components/responses/Error' }
  /studio/source-groups:
    get:
      operationId: listSourceGroups
      parameters:
        - { name: playlist_id, in: query, schema: { type: integer, format: int64 } }
        - name: lineup_id
          in: query
          description: Active lineup used to calculate available source-channel counts.
          schema: { type: integer, format: int64 }
        - name: unused_only
          in: query
          description: Hide groups with no unused channels and count only channels unused by the active lineup. Requires lineup_id.
          schema: { type: boolean, default: false }
        - name: enabled_only
          in: query
          description: Return only enabled groups that contain enabled channels, and count only those channels.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Playlist groups available as one-way lineup subscriptions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceGroupPage' }
        default: { $ref: '#/components/responses/Error' }
  /studio/source-groups/{source_group_id}/enabled:
    patch:
      operationId: setSourceGroupEnabled
      description: Changes group-wide source availability without overwriting channel-level enablement choices or removing lineup membership.
      parameters:
        - { $ref: '#/components/parameters/SourceGroupIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '204': { description: Group availability saved. }
        default: { $ref: '#/components/responses/Error' }
  /studio/lineups/{lineup_id}/source-groups/{source_group_id}/copy:
    post:
      operationId: copySourceGroupToLineup
      parameters:
        - { $ref: '#/components/parameters/LineupId' }
        - { $ref: '#/components/parameters/SourceGroupIdPath' }
      responses:
        '201':
          description: A manual lineup group was created from the source group's current snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceGroupImportResult' }
        default: { $ref: '#/components/responses/Error' }
  /studio/lineups/{lineup_id}/groups/{group_id}/position:
    patch:
      operationId: moveWorkspaceGroup
      parameters:
        - { $ref: '#/components/parameters/LineupId' }
        - { $ref: '#/components/parameters/GroupIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionRequest' }
      responses:
        '204': { description: Group position saved for this lineup. }
        default: { $ref: '#/components/responses/Error' }
  /studio/groups/{group_id}:
    patch:
      operationId: updateStudioGroup
      parameters: [{ $ref: '#/components/parameters/GroupIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudioGroupUpdateRequest' }
      responses:
        '204': { description: Lineup group updated. }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteStudioGroup
      parameters: [{ $ref: '#/components/parameters/GroupIdPath' }]
      responses:
        '204': { description: Lineup group deleted. }
        default: { $ref: '#/components/responses/Error' }
  /studio/groups/{group_id}/source-link:
    put:
      operationId: setGroupSourceLink
      parameters: [{ $ref: '#/components/parameters/GroupIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceGroupLinkRequest' }
      responses:
        '202':
          description: Source link saved and initial reconciliation queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationJobReference' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: disconnectGroupSourceLink
      parameters:
        - { $ref: '#/components/parameters/GroupIdPath' }
        - name: retain_channels
          in: query
          schema: { type: boolean, default: true }
      responses:
        '204': { description: Source link disconnected. }
        default: { $ref: '#/components/responses/Error' }
  /studio/groups/{group_id}/sync:
    post:
      operationId: syncSourceGroup
      parameters: [{ $ref: '#/components/parameters/GroupIdPath' }]
      responses:
        '202':
          description: Reconciliation queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationJobReference' }
        default: { $ref: '#/components/responses/Error' }
  /studio/groups/{group_id}/channels:
    get:
      operationId: listWorkspaceChannels
      parameters:
        - { $ref: '#/components/parameters/GroupIdPath' }
        - name: lineup_id
          in: query
          description: Required when filtering duplicate guide IDs because conflicts are lineup scoped.
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/MatchHealth'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ordered channels in a lineup group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceChannelPage' }
        default: { $ref: '#/components/responses/Error' }
  /studio/groups/{group_id}/channels/batch-add:
    post:
      operationId: batchAddWorkspaceChannels
      parameters: [{ $ref: '#/components/parameters/GroupIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceBatchAddRequest' }
      responses:
        '201':
          description: Canonical lineup channels created with manually locked source variants.
          content:
            application/json:
              schema:
                type: object
                required: [channel_ids, total]
                properties:
                  channel_ids: { type: array, items: { type: integer, format: int64 } }
                  total: { type: integer }
        default: { $ref: '#/components/responses/Error' }
  /studio/groups/{group_id}/source-groups/{source_group_id}/add:
    post:
      operationId: addSourceGroupToStudioGroup
      parameters:
        - { $ref: '#/components/parameters/GroupIdPath' }
        - { $ref: '#/components/parameters/SourceGroupIdPath' }
      responses:
        '201':
          description: Missing channels from the source group were appended as manual channels.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceGroupImportResult' }
        default: { $ref: '#/components/responses/Error' }
  /studio/groups/{group_id}/channels/batch-remove:
    post:
      operationId: batchRemoveWorkspaceChannels
      parameters: [{ $ref: '#/components/parameters/GroupIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceBatchRemoveRequest' }
      responses:
        '204': { description: Canonical lineup channels removed. }
        default: { $ref: '#/components/responses/Error' }
  /studio/groups/{group_id}/channels/batch-move:
    post:
      operationId: batchMoveWorkspaceChannels
      parameters: [{ $ref: '#/components/parameters/GroupIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceBatchMoveRequest' }
      responses:
        '204': { description: Selected channels moved as an ordered block. }
        default: { $ref: '#/components/responses/Error' }
  /studio/groups/{group_id}/channels/{channel_id}/position:
    patch:
      operationId: moveWorkspaceChannel
      parameters:
        - { $ref: '#/components/parameters/GroupIdPath' }
        - { $ref: '#/components/parameters/ChannelId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionRequest' }
      responses:
        '204': { description: Position saved. }
        default: { $ref: '#/components/responses/Error' }
  /studio/channels/{channel_id}:
    patch:
      operationId: updateWorkspaceChannel
      parameters: [{ $ref: '#/components/parameters/ChannelId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceChannelUpdate' }
      responses:
        '204': { description: Channel saved. }
        default: { $ref: '#/components/responses/Error' }
  /studio/source-channels:
    get:
      operationId: listSourceChannels
      parameters:
        - { name: playlist_id, in: query, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/GroupId'
        - name: lineup_id
          in: query
          description: Active lineup used to evaluate whether a source is already attached.
          schema: { type: integer, format: int64 }
        - name: unused_only
          in: query
          description: Hide sources already attached as any channel variant in the active lineup. Requires lineup_id.
          schema: { type: boolean, default: false }
        - name: enabled_only
          in: query
          description: Return only channels whose channel and parent group are enabled.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Source catalog channels.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceChannelPage' }
        default: { $ref: '#/components/responses/Error' }
  /studio/source-channels/{source_channel_id}/logo:
    get:
      operationId: getSourceChannelLogo
      description: Returns a normalized source logo through the authenticated outbound-fetch boundary. The provider URL is never exposed to the browser.
      parameters:
        - name: source_channel_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Normalized source logo.
          headers:
            Cache-Control:
              schema: { type: string, example: 'private, no-store' }
          content:
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /studio/source-channels/enabled:
    patch:
      operationId: setSourceChannelsEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_ids, enabled]
              properties:
                channel_ids: { type: array, minItems: 1, items: { type: integer, format: int64 } }
                enabled: { type: boolean }
      responses:
        '204': { description: Enablement saved. }
        default: { $ref: '#/components/responses/Error' }
  /studio/review:
    get:
      operationId: listMatchReview
      parameters:
        - { name: channel_id, in: query, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Low-confidence matches requiring review.
          content:
            { application/json: { schema: { $ref: '#/components/schemas/MatchReviewPage' } } }
        default: { $ref: '#/components/responses/Error' }
  /studio/channels/{channel_id}/matches:
    get:
      operationId: listChannelMatches
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ordered source matches for a lineup channel.
          content:
            { application/json: { schema: { $ref: '#/components/schemas/MatchReviewPage' } } }
        default: { $ref: '#/components/responses/Error' }
  /studio/channels/{channel_id}/suggestions:
    get:
      operationId: listChannelMatchSuggestions
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: limit
          in: query
          description: Number of closest eligible suggestions to return, capped at five. Weak matches are included for manual review.
          schema: { type: integer, minimum: 1, maximum: 5, default: 5 }
      responses:
        '200':
          description: Highest-confidence eligible source matches for a lineup channel.
          content:
            { application/json: { schema: { $ref: '#/components/schemas/MatchSuggestionPage' } } }
        default: { $ref: '#/components/responses/Error' }
  /studio/channels/{channel_id}/rejections:
    get:
      operationId: listChannelMatchRejections
      parameters: [{ $ref: '#/components/parameters/ChannelId' }]
      responses:
        '200':
          description: Durable source identities rejected for this channel.
          content:
            { application/json: { schema: { $ref: '#/components/schemas/MatchRejectionPage' } } }
        default: { $ref: '#/components/responses/Error' }
  /studio/channels/{channel_id}/rejections/{rejection_id}:
    delete:
      operationId: restoreChannelMatchRejection
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: rejection_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Rejection removed; the source is eligible for matching again. }
        default: { $ref: '#/components/responses/Error' }
  /studio/channels/{channel_id}/matches/{source_channel_id}/accept:
    post:
      operationId: acceptChannelMatch
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/SourceChannelId'
      responses:
        '204': { description: Match accepted, manually locked, and appended to the failover order. }
        default: { $ref: '#/components/responses/Error' }
  /studio/channels/{channel_id}/matches/{source_channel_id}/position:
    patch:
      operationId: moveChannelSourceVariant
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/SourceChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionRequest' }
      responses:
        '204': { description: Source failover position saved. }
        default: { $ref: '#/components/responses/Error' }
  /studio/channels/{channel_id}/matches/{source_channel_id}/reject:
    post:
      operationId: rejectChannelMatch
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/SourceChannelId'
      responses:
        '204': { description: Match rejected and its stable identity recorded. }
        default: { $ref: '#/components/responses/Error' }
  /studio/sources/{source_id}/refresh:
    post:
      operationId: refreshPlaylistSource
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        default: { $ref: '#/components/responses/Error' }
  /studio/guide-data/sources/{source_id}/refresh:
    post:
      operationId: refreshGuideSource
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        default: { $ref: '#/components/responses/Error' }
  /studio/lineups/{lineup_id}/publish:
    post:
      operationId: publishLineup
      parameters: [{ $ref: '#/components/parameters/LineupId' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        default: { $ref: '#/components/responses/Error' }
  /jobs:
    get:
      operationId: listJobs
      responses:
        '200':
          description: Recent operation jobs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationJobPage' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{job_id}:
    get:
      operationId: getJob
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Operation job.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperationJob' } } }
        default: { $ref: '#/components/responses/Error' }
  /events:
    get:
      operationId: subscribeToEvents
      responses:
        '200':
          description: Resumable Server-Sent Event snapshots for jobs and resources.
          content: { text/event-stream: { schema: { type: string } } }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-xivi_session
      description: Opaque public HTTPS session. Trusted direct-LAN HTTP uses the separate xivi_lan_session cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session-bound token returned by GET /auth/session.
    mediaKey:
      type: apiKey
      in: query
      name: access_token
      description: Named, revocable device credential restricted by lineup and network scope. Authentication uses a keyed hash; the recoverable copy is encrypted at rest solely to rebuild owner-visible output URLs.
  parameters:
    LineupId:
      { name: lineup_id, in: path, required: true, schema: { type: integer, format: int64 } }
    GroupIdPath:
      { name: group_id, in: path, required: true, schema: { type: integer, format: int64 } }
    ChannelId:
      { name: channel_id, in: path, required: true, schema: { type: integer, format: int64 } }
    SourceId:
      { name: source_id, in: path, required: true, schema: { type: integer, format: int64 } }
    UserId: { name: user_id, in: path, required: true, schema: { type: integer, format: int64 } }
    SourceChannelId:
      {
        name: source_channel_id,
        in: path,
        required: true,
        schema: { type: integer, format: int64 }
      }
    SourceGroupIdPath:
      name: source_group_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GroupId: { name: group_id, in: query, schema: { type: integer, format: int64 } }
    Search: { name: q, in: query, schema: { type: string, maxLength: 255 } }
    MatchHealth:
      name: match
      in: query
      description: Restrict lineup channels to a match-health state.
      schema: { type: string, enum: [unmatched, low-confidence, duplicate-tvg-id] }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
  responses:
    Error:
      description: Standard Xivi error.
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    LineupPage:
      description: Paginated lineups.
      content: { application/json: { schema: { $ref: '#/components/schemas/LineupPage' } } }
    GuideChannelPage:
      description: Paginated channels.
      content: { application/json: { schema: { $ref: '#/components/schemas/GuideChannelPage' } } }
    WatchGroupPage:
      description: Ordered non-empty Watch groups.
      content: { application/json: { schema: { $ref: '#/components/schemas/WatchGroupPage' } } }
    JobAccepted:
      description: Background operation accepted.
      content:
        application/json:
          schema:
            type: object
            required: [job_id, status]
            properties:
              job_id: { type: integer, format: int64 }
              status: { type: string, enum: [queued] }
  schemas:
    VirtualTunerDevice:
      type: object
      required:
        [
          lineup_id,
          lineup_name,
          enabled,
          fill_missing_guide_slots,
          device_id,
          tuner_count,
          base_url,
          lineup_url
        ]
      properties:
        lineup_id: { type: integer, format: int64 }
        lineup_name: { type: string }
        enabled: { type: boolean }
        fill_missing_guide_slots:
          type: boolean
          description: Whether uncovered XMLTV intervals receive export-only placeholder programmes.
        device_id: { type: string, pattern: '^[0-9A-F]{8}$' }
        tuner_count: { type: integer, minimum: 1, maximum: 255 }
        base_url: { type: string, format: uri }
        lineup_url: { type: string, format: uri }
    DeviceOutputs:
      type: object
      required: [virtual_tuner]
      properties:
        virtual_tuner:
          type: object
          required: [enabled_count, running, port, devices]
          properties:
            enabled_count: { type: integer, minimum: 0 }
            running: { type: boolean }
            port: { type: integer, const: 65001 }
            devices: { type: array, items: { $ref: '#/components/schemas/VirtualTunerDevice' } }
    SessionPrincipal:
      type: object
      required:
        [user_id, username, role, must_change_password, mfa_enabled, mfa_required, lineup_ids]
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
        must_change_password: { type: boolean }
        mfa_enabled: { type: boolean }
        mfa_required: { type: boolean }
        lineup_ids: { type: array, items: { type: integer, format: int64 } }
        csrf_token: { type: string, description: Required on cookie-authenticated mutations. }
    ReauthenticationRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, format: password }
    AuthSessionMetadata:
      type: object
      required:
        [
          id,
          transport_scope,
          created_at,
          last_seen_at,
          idle_expires_at,
          absolute_expires_at,
          client_ip
        ]
      properties:
        id: { type: integer, format: int64 }
        transport_scope: { type: string, enum: [https, lan_http] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        client_ip: { type: string }
    UserSummary:
      type: object
      required:
        [id, username, role, must_change_password, mfa_enabled, created_at, updated_at, lineup_ids]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
        must_change_password: { type: boolean }
        mfa_enabled: { type: boolean }
        disabled_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        lineup_ids: { type: array, items: { type: integer, format: int64 } }
    LineupGrant:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    UserWriteRequest:
      type: object
      additionalProperties: false
      required: [username, password, role, disabled, lineup_ids]
      properties:
        username: { type: string }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
