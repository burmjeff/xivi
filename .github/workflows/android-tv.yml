name: Android TV verification

on:
  workflow_call:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  native-tv:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            target: android-tv
            arch: x86
            profile: tv_1080p
          - api: 35
            target: google_apis
            arch: x86_64
            profile: pixel_2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Select runner JDK 21 and enable KVM
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build shared phone assets and native TV shell
        run: |
          npm ci
          npm audit --audit-level=low
          npm run check
          node --test .github/scripts/android-release.test.mjs
          npm run build:mobile
          bash android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: TV Keystore, remote, guide and playback tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            if [ '${{ matrix.target }}' = 'google_apis' ]; then adb shell wm size 1080x1920; adb shell wm density 320; fi
            bash android/gradlew -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.xivi.app.tv
