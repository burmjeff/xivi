name: Security verification

on:
  pull_request:
  push:
    branches: ['main']
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned native test environment
        run: docker build --target development --tag xivi-security-dev .
      - name: Test, audit dependencies, and enforce SQL construction
        run: |
          docker run --rm -v "$PWD:/workspace:ro" xivi-security-dev bash -lc '
            set -euo pipefail
            ci_workspace="$(mktemp -d)"
            tar --exclude=.git --exclude=node_modules --exclude=.svelte-kit --exclude=build \
              -C /workspace -cf - . | tar -C "$ci_workspace" -xf -
            cd "$ci_workspace"
            npm ci && npm audit --audit-level=low && npm run check && npm run build &&
            go test ./... &&
            go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./... &&
            go run github.com/securego/gosec/v2/cmd/gosec@v2.22.11 -include=G201,G202 ./...
          '
      - name: Semgrep SQL rules
        run: docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.136.0 semgrep scan --no-git-ignore --config /src/.semgrep.yml --error /src/backend
      - name: Build final image
        run: docker build --target deployment --tag xivi-security:ci .
      - name: Scan final image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: xivi-security:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          version: v0.70.0
          cache: true
          token-setup-trivy: ${{ github.token }}
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: xivi-security:ci
          format: spdx-json
          output-file: xivi.spdx.json
