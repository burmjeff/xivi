name: Security verification

on:
  workflow_call:
  pull_request:
  push:
    branches: ['main']
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=moby/buildkit:rootless
            network=host
      - name: Test, audit dependencies, and enforce SQL construction
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: security-tests
          outputs: type=cacheonly
          no-cache-filters: security-tests
          cache-from: |
            type=gha,scope=security-tests
            type=gha,scope=security-deployment
          cache-to: type=gha,scope=security-tests,mode=max
      - name: Semgrep SQL rules
        run: docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.136.0 semgrep scan --no-git-ignore --config /src/.semgrep.yml --error /src/backend
      - name: Build final image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: deployment
          load: true
          tags: xivi-security:ci
          cache-from: |
            type=gha,scope=security-deployment
            type=gha,scope=security-tests
          cache-to: type=gha,scope=security-deployment,mode=max
      - name: Scan final image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: xivi-security:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          version: v0.74.0
          cache: true
          token-setup-trivy: ${{ github.token }}
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: xivi-security:ci
          format: spdx-json
          output-file: xivi.spdx.json
